<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pedido de Marco: el favicon usa el mismo logo del branding (ver
         `assets/brand/logo.png`, consumido por `Sidebar.tsx`/
         `AppShell.tsx`) -- copiado a `public/favicon.png` (64x64,
         reescalado con `sips`) en vez de importarlo desde `src/`: un
         favicon referenciado en `index.html` necesita una URL estática
         servida tal cual, no un asset procesado/hasheado por Vite. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texture Studio</title>
    <!-- Ticket 034 (HU-5): aplica el tema guardado ANTES de cualquier
         CSS/render, para que no haya un parpadeo del tema por defecto.
         Duplica la clave/default de `src/theme.ts` en JS plano (no
         puede importar ese módulo aquí) -- si esa clave cambia, hay que
         actualizar también este script. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('ts-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (err) {
          console.warn('index.html: no se pudo leer el tema guardado -- se usa "dark" por defecto.', err);
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
