# Ticket 001: vhost de nginx para los 3 subdominios de texture-studio-mc.
# Mismo patron que auth-core-mc.conf/mail-core-mc.conf: nginx de fabrica
# de la VM en 80/443, Traefik puertas adentro en 127.0.0.1:8000 (ver
# docs/ARQUITECTURA.md de auth-core-mc, ticket 049, para el porque
# completo de esta decision de Marco).
#
# Solo HTTP por ahora (puerto 80) -- SIN bloque 443/ssl todavia: requiere
# que los 3 registros DNS (texture-studio[.qa][-dev].64bitstudio.com) ya
# existan y resuelvan antes de correr certbot (ver certbotDomains en el
# Jenkinsfile raiz -- corePipeline lo corre automatico en cada deploy a
# dev, tolerante a fallo si el DNS aun no esta listo).
#
# nginx reenvia TODO (incluida cualquier ruta /.well-known/acme-challenge/
# que certbot necesite) al Traefik interno.
server {
    listen 80;
    listen [::]:80;
    server_name texture-studio.64bitstudio.com texture-studio-qa.64bitstudio.com texture-studio-dev.64bitstudio.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
